<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Portal ALCE</title>

  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      background:
        #f4f1e8;

      color:
        #29251f;

      display: flex;

      justify-content: center;

      align-items: center;

    }


    .pagina {

      width: 100%;

      max-width: 760px;

      padding: 40px 24px;

      text-align: center;

    }


    .ornamento {

      font-size: 28px;

      margin-bottom: 12px;

      opacity: 0.7;

    }


    h1 {

      margin: 0;

      font-size: 42px;

      font-weight: normal;

      letter-spacing: 2px;

    }


    .subtitulo {

      margin-top: 10px;

      margin-bottom: 42px;

      font-size: 18px;

      color: #625b50;

    }


    .aplicacoes {

      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(260px, 1fr)
        );

      gap: 18px;

    }


    .aplicacao {

      display: block;

      padding: 24px 20px;

      text-decoration: none;

      color: inherit;

      background: #fffdf8;

      border: 1px solid #d8d0c1;

      border-radius: 6px;

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        border-color 0.15s ease;

    }


    .aplicacao:hover {

      transform:
        translateY(-2px);

      border-color:
        #aaa08e;

      box-shadow:
        0 5px 16px
        rgba(0, 0, 0, 0.08);

    }


    .icone {

      font-size: 30px;

      margin-bottom: 10px;

    }


    .nome {

      font-size: 22px;

      margin-bottom: 7px;

    }


    .descricao {

      font-size: 15px;

      line-height: 1.5;

      color: #6b6459;

    }


    footer {

      margin-top: 44px;

      font-size: 13px;

      color: #8a8276;

    }

  </style>

</head>


<body>

  <main class="pagina">

    <div class="ornamento">
      ❦
    </div>


    <h1>
      PORTAL ALCE
    </h1>


    <div class="subtitulo">
      Assistentes do Mosteiro
    </div>


    <section class="aplicacoes">


      <!-- =====================================================
           ALCE — HOSPEDARIA
           ===================================================== -->

      <a
        class="aplicacao"
        href="https://script.google.com/a/macros/mosteirodasantacruz.org.br/s/AKfycbx34HiwD-S36titlXfySCPOhi6DBGEgqbw4bUAuxVRXQvkEYiD7gXyL-I3d-mFd5xnx/exec"
      >

        <div class="icone">
          🏠
        </div>

        <div class="nome">
          ALCE — Hospedaria
        </div>

        <div class="descricao">
          Consultas e informações
          da hospedaria do Mosteiro.
        </div>

      </a>


      <!-- =====================================================
           FUTUROS ALCEs
           =====================================================

      <a class="aplicacao" href="LINK">
        <div class="icone">📅</div>

        <div class="nome">
          ALCE — Agenda
        </div>

        <div class="descricao">
          Agenda e compromissos
          do Mosteiro.
        </div>
      </a>


      <a class="aplicacao" href="LINK">
        <div class="icone">🛒</div>

        <div class="nome">
          ALCE — Compras
        </div>

        <div class="descricao">
          Compras e encomendas
          do Mosteiro.
        </div>
      </a>

      ===================================================== -->

    </section>


    <footer>
      AUCE · Mosteiro da Santa Cruz
    </footer>

  </main>

</body>

</html>
