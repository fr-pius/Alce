<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Alce — Organização</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {

      display: flex;
      flex-direction: column;
      align-items: center;

      background:
        radial-gradient(
          circle at center,
          #f5f8f2 0%,
          #e8efe2 45%,
          #d8e4d0 100%
        );

      color: #29432b;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

    }

    h1 {

      margin-top: 55px;
      margin-bottom: 20px;

      font-size: clamp(42px, 7vw, 72px);

      font-weight: normal;

      letter-spacing: 2px;

      text-align: center;

      text-shadow:
        0 2px 3px rgba(0, 0, 0, 0.12);

    }

    .subtitulo {

      margin-bottom: 25px;

      font-size: 18px;

      font-style: italic;

      opacity: 0.75;

    }

    .logo-container {

      flex: 1;

      display: flex;

      align-items: center;
      justify-content: center;

      width: 100%;

      padding: 20px;

    }

    .logo {

      max-width: min(420px, 75vw);
      max-height: 55vh;

      object-fit: contain;

      filter:
        drop-shadow(
          0 12px 18px
          rgba(0, 0, 0, 0.16)
        );

    }

    footer {

      padding: 20px;

      font-size: 14px;

      font-style: italic;

      opacity: 0.55;

    }

  </style>

</head>


<body>

  <h1>Em breve...</h1>

  <div class="subtitulo">
    O responsável pela convergência do rebanho:
  </div>

  <div class="logo-container">

    <img
      class="logo"
      src="logo_vertex.png"
      alt="Alce Vertex"
    >

  </div>

  <footer>
    Mosteiro da Santa Cruz
  </footer>

</body>

</html>
