<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#102018">

<title>Barbas — Memória do Mosteiro</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  margin: 0;
}

body {
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background: #f5f3ee;
  color: #20251f;

  overflow: hidden;
}


/* =========================================================
   ESTRUTURA PRINCIPAL
   ========================================================= */

.app {
  height: 100dvh;

  display: flex;
  flex-direction: column;
}


/* =========================================================
   CABEÇALHO
   ========================================================= */

header {
  flex: 0 0 auto;

  text-align: center;

  padding: 22px 18px 10px;
}


.barbas-logo {
  width: 300px;
  height: 300px;

  object-fit: contain;

  display: block;

  margin: 0 auto 8px;

}


.barbas-placeholder {
  width: 92px;
  height: 92px;

  margin: 0 auto 8px;


  display: flex;

  align-items: center;
  justify-content: center;

  background: #e4e1d8;

  border: 1px solid #c9c5ba;

  font-size: 38px;
}


h1 {
  font-size: 20px;

  font-weight: 500;

  margin: 0;

  color: #30372f;
}


/* =========================================================
   ÁREA PRINCIPAL DO CHAT
   ========================================================= */

main {
  flex: 1 1 auto;

  min-height: 0;

  width: 100%;

  max-width: 1100px;

  margin: 0 auto;

  display: flex;

  flex-direction: column;

  padding: 8px 18px 14px;
}


/* =========================================================
   MENSAGENS
   ========================================================= */

#messages {
  flex: 1 1 auto;

  min-height: 0;

  overflow-y: auto;

  padding: 10px 2px 18px;

  scroll-behavior: smooth;
}


.message {
  display: flex;

  width: 100%;

  margin: 10px 0;
}


.message.user {
  justify-content: flex-end;
}


.message.barbas {
  justify-content: flex-start;

  width: 100%;
}


/* =========================================================
   BALÕES
   ========================================================= */

.bubble {
  display: block;

  width: fit-content;

  max-width: min(850px, 90%);

  padding: 12px 15px;

  border-radius: 18px;

  line-height: 1.45;

  white-space: pre-wrap;

  overflow-wrap: anywhere;

  word-break: normal;
}


.user .bubble {
  background: #dce9df;

  border-bottom-right-radius: 5px;
}


.barbas .bubble {
  background: white;

  border: 1px solid #e1ded6;

  border-bottom-left-radius: 5px;
}


/* =========================================================
   BOTÃO DE VOZ
   ========================================================= */

.quick-actions {
  flex: 0 0 auto;

  display: flex;

  justify-content: center;

  align-items: center;

  padding: 10px 0 8px;
}


.voice {
  width: 68px;
  height: 68px;

  padding: 0;

  border-radius: 50%;

  border: 0;

  background: #102018;

  color: white;

  font-size: 27px;

  display: flex;

  align-items: center;
  justify-content: center;

  cursor: pointer;

  box-shadow: 0 4px 14px rgba(0,0,0,.14);
}


.voice.listening {
  background: #486b52;

  outline: 3px solid #9bb29e;
}


/* =========================================================
   BARRA DE TEXTO
   ========================================================= */

.composer {
  flex: 0 0 auto;

  display: flex;

  align-items: center;

  gap: 8px;

  background: white;

  border: 1px solid #d8d5cd;

  border-radius: 24px;

  padding: 7px;

  box-shadow: 0 3px 15px rgba(0,0,0,.06);
}


.composer input {
  flex: 1;

  min-width: 0;

  border: 0;

  outline: 0;

  background: transparent;

  padding: 10px 12px;

  font: inherit;

  font-size: 16px;
}


button {
  font: inherit;

  border: 0;

  cursor: pointer;
}


.send {
  background: #102018;

  color: white;

  border-radius: 19px;

  padding: 9px 14px;

  white-space: nowrap;
}


/* =========================================================
   BOTÃO DO HISTÓRICO
   ========================================================= */

#historyButton {
  position: fixed;

  right: 18px;

  bottom: 18px;

  width: 52px;

  height: 52px;

  border-radius: 50%;

  background: #102018;

  color: white;

  font-size: 22px;

  box-shadow: 0 5px 18px rgba(0,0,0,.18);

  z-index: 20;
}


/* =========================================================
   PAINEL DO HISTÓRICO
   ========================================================= */

#historyPanel {
  position: fixed;

  right: 18px;

  bottom: 82px;

  width: min(360px, calc(100vw - 36px));

  max-height: min(520px, calc(100dvh - 110px));

  background: white;

  border: 1px solid #d7d4cb;

  border-radius: 18px;

  box-shadow: 0 12px 35px rgba(0,0,0,.18);

  display: none;

  flex-direction: column;

  overflow: hidden;

  z-index: 19;
}


#historyPanel.open {
  display: flex;
}


.history-head {
  display: flex;

  justify-content: space-between;

  align-items: center;

  padding: 15px 17px;

  border-bottom: 1px solid #e5e2da;
}


.history-head strong {
  font-size: 16px;
}


.close {
  background: transparent;

  font-size: 20px;

  color: #59605a;
}


#historyList {
  overflow-y: auto;

  padding: 8px;
}


.operation {
  padding: 11px 10px;

  border-bottom: 1px solid #eeeae2;
}


.operation:last-child {
  border-bottom: 0;
}


.op-top {
  display: flex;

  justify-content: space-between;

  gap: 8px;

  font-size: 12px;

  color: #777b75;
}


.op-text {
  margin-top: 5px;

  font-size: 14px;
}


.status {
  font-size: 11px;

  font-weight: 650;

  padding: 3px 7px;

  border-radius: 10px;

  white-space: nowrap;
}


.confirmed {
  background: #dcebdd;

  color: #315d38;
}


.denied {
  background: #f0dddd;

  color: #793737;
}


.pending {
  background: #eee9d7;

  color: #6d5d28;
}


/* =========================================================
   CELULAR / TABLET
   ========================================================= */

@media (max-width: 620px) {

  header {
    padding-top: 14px;
  }

  .barbas-logo,
  .barbas-placeholder {
    width: 220px;
    height: 220px;
  }

  .composer {
    border-radius: 20px;
  }

  .quick-actions {
    padding-bottom: 2px;
  }

  .bubble {
    max-width: 94%;
  }

}

</style>
</head>


<body>

<div class="app">


  <!-- =====================================================
       CABEÇALHO
       ===================================================== -->

  <header>

    <img
      id="barbasImage"
      class="barbas-logo"
      src="https://raw.githubusercontent.com/fr-pius/Alce/main/logo_barbas.png"
      alt="Barbas"
      onerror="
        this.style.display='none';
        document.getElementById('placeholder').style.display='flex';
      "
    >

    <div
      id="placeholder"
      class="barbas-placeholder"
      style="display:none;"
    >
      🫎
    </div>

    <h1>Como posso ajudá-lo?</h1>

  </header>


  <!-- =====================================================
       CHAT
       ===================================================== -->

  <main>

    <section
      id="messages"
      aria-live="polite"
    >

      <div class="message barbas">

        <div class="bubble">
          Estou à disposição. Pode falar comigo ou escrever o que precisa.
        </div>

      </div>

    </section>


    <!-- ===================================================
         BOTÃO DE VOZ
         =================================================== -->

    <div class="quick-actions">

      <button
        id="voiceButton"
        class="voice"
        aria-label="Falar com o Barbas"
      >
        🎙
      </button>

    </div>


    <!-- ===================================================
         CAMPO DE TEXTO
         =================================================== -->

    <form
      id="composer"
      class="composer"
    >

      <input
        id="input"
        type="text"
        autocomplete="off"
        placeholder="Escreva uma mensagem..."
        aria-label="Mensagem para o Barbas"
      >

      <button
        class="send"
        type="submit"
      >
        Enviar
      </button>

    </form>

  </main>

</div>


<!-- =======================================================
     BOTÃO DO HISTÓRICO
     ======================================================= -->

<button
  id="historyButton"
  aria-label="Abrir histórico das operações"
>
  ☷
</button>


<!-- =======================================================
     HISTÓRICO
     ======================================================= -->

<aside
  id="historyPanel"
  aria-label="Histórico das operações"
>

  <div class="history-head">

    <strong>
      Últimas operações
    </strong>

    <button
      class="close"
      id="closeHistory"
      aria-label="Fechar"
    >
      ×
    </button>

  </div>

  <div id="historyList"></div>

</aside>


<script>

/* =========================================================
   ELEMENTOS
   ========================================================= */

const messages =
  document.getElementById('messages');

const input =
  document.getElementById('input');

const composer =
  document.getElementById('composer');

const voiceButton =
  document.getElementById('voiceButton');

const historyButton =
  document.getElementById('historyButton');

const historyPanel =
  document.getElementById('historyPanel');

const closeHistory =
  document.getElementById('closeHistory');

const historyList =
  document.getElementById('historyList');


/* =========================================================
   HISTÓRICO LOCAL
   ========================================================= */

let operations =
  JSON.parse(
    localStorage.getItem('barbas.operations') || '[]'
  );


/* =========================================================
   ADICIONAR MENSAGEM
   ========================================================= */

function addMessage(text, who) {

  const row =
    document.createElement('div');

  row.className =
    'message ' + who;


  const bubble =
    document.createElement('div');

  bubble.className =
    'bubble';


  bubble.textContent =
    text;


  row.appendChild(bubble);

  messages.appendChild(row);


  messages.scrollTop =
    messages.scrollHeight;
}


/* =========================================================
   REGISTRAR OPERAÇÃO
   ========================================================= */

function addOperation(
  text,
  status = 'pending'
) {

  const item = {

    text,

    status,

    time:
      new Date().toLocaleString(
        'pt-BR',
        {
          dateStyle: 'short',
          timeStyle: 'short'
        }
      )

  };


  operations.unshift(item);


  operations =
    operations.slice(0, 20);


  localStorage.setItem(
    'barbas.operations',
    JSON.stringify(operations)
  );


  renderHistory();
}


/* =========================================================
   EXIBIR HISTÓRICO
   ========================================================= */

function renderHistory() {

  historyList.innerHTML = '';


  if (!operations.length) {

    historyList.innerHTML =
      '<div class="operation">' +
      '<div class="op-text">' +
      'Nenhuma operação registrada.' +
      '</div>' +
      '</div>';

    return;
  }


  operations.forEach(op => {

    const div =
      document.createElement('div');

    div.className =
      'operation';


    const statusLabel = {

      confirmed:
        'confirmado',

      denied:
        'acesso negado',

      pending:
        'pendente'

    }[op.status] || op.status;


    div.innerHTML = `

      <div class="op-top">

        <span>
          ${escapeHtml(op.time)}
        </span>

        <span
          class="status ${escapeHtml(op.status)}"
        >
          ${statusLabel}
        </span>

      </div>

      <div class="op-text">
        ${escapeHtml(op.text)}
      </div>

    `;


    historyList.appendChild(div);

  });

}


/* =========================================================
   PROTEÇÃO HTML
   ========================================================= */

function escapeHtml(s) {

  return String(s).replace(
    /[&<>"']/g,

    c => ({

      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#039;'

    }[c])

  );

}


/* =========================================================
   ENVIO DE MENSAGEM
   ========================================================= */

async function sendMessage(text) {

  text =
    text.trim();


  if (!text)
    return;


  addMessage(
    text,
    'user'
  );


  input.value =
    '';


  addOperation(
    text,
    'pending'
  );


  /*
    FUTURO PONTO DE INTEGRAÇÃO

    POST /api/chat

    O pedido será enviado ao
    Barbas + Qwen 34B local.

    Por enquanto estamos apenas
    simulando a resposta.
  */


  setTimeout(() => {

    addMessage(
      'Recebi sua solicitação. A conexão com o Barbas/Qwen local será ligada nesta etapa do desenvolvimento.',
      'barbas'
    );

  }, 350);

}


/* =========================================================
   ENVIO PELO CAMPO DE TEXTO
   ========================================================= */

composer.addEventListener(
  'submit',
  event => {

    event.preventDefault();

    sendMessage(
      input.value
    );

  }
);


/* =========================================================
   HISTÓRICO
   ========================================================= */

historyButton.addEventListener(
  'click',
  () => {

    historyPanel.classList.toggle(
      'open'
    );

    renderHistory();

  }
);


closeHistory.addEventListener(
  'click',
  () => {

    historyPanel.classList.remove(
      'open'
    );

  }
);


/* =========================================================
   RECONHECIMENTO DE VOZ
   ========================================================= */

let recognition = null;


const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition) {

  recognition =
    new SpeechRecognition();


  recognition.lang =
    'pt-BR';


  recognition.interimResults =
    false;


  recognition.continuous =
    false;


  recognition.onstart = () => {

    voiceButton.classList.add(
      'listening'
    );

    voiceButton.textContent =
      '●';

  };


  recognition.onend = () => {

    voiceButton.classList.remove(
      'listening'
    );

    voiceButton.textContent =
      '🎙';

  };


  recognition.onerror = () => {

    voiceButton.classList.remove(
      'listening'
    );

    voiceButton.textContent =
      '🎙';


    addMessage(
      'Não consegui acessar o reconhecimento de voz neste navegador.',
      'barbas'
    );

  };


  recognition.onresult =
    event => {

      const text =
        event.results[0][0].transcript;


      sendMessage(text);

    };


  voiceButton.addEventListener(
    'click',
    () => {

      recognition.start();

    }
  );

}


/* =========================================================
   NAVEGADOR SEM RECONHECIMENTO DE VOZ
   ========================================================= */

else {

  voiceButton.addEventListener(
    'click',
    () => {

      addMessage(
        'O reconhecimento de voz deste protótipo não está disponível neste navegador. Na versão local do AUCE, poderemos substituir isso por reconhecimento de voz local.',
        'barbas'
      );

    }
  );

}


/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */

renderHistory();

</script>

</body>
</html>
